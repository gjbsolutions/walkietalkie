<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkie</title>
<style>
:root{--bg:#0f1317;--panel:#171d23;--line:#27303a;--fg:#d8e1ea;--dim:#7d8a97;--acc:#2fd3ff;--ok:#4ade80;--warn:#facc15;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0;font-weight:600;flex:1}
button,input,select{background:#202a33;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:#05222b;border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok)}
.dim{color:var(--dim)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px;text-align:center}
#state{font-size:26px;font-weight:600}
#info{min-height:1.4em}
#ptt{--lvl:0;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;margin:34px 0;font-size:20px;font-weight:600;line-height:1.2;background:var(--panel);border:3px solid var(--acc);color:var(--fg);user-select:none;-webkit-user-select:none;touch-action:none;
  box-shadow:0 0 0 calc(4px + var(--lvl)*34px) rgba(47,211,255,.16)}
#ptt.rx{border-color:var(--ok);box-shadow:0 0 0 calc(4px + var(--lvl)*34px) rgba(74,222,128,.2)}
#ptt.tx{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 0 calc(4px + var(--lvl)*34px) rgba(248,113,113,.28)}
details{width:min(100%,460px);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{display:flex;gap:6px;align-items:center;color:var(--dim)}
#key{flex:1;min-width:200px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
@media(prefers-reduced-motion:no-preference){#ptt{transition:box-shadow .06s,background .15s,border-color .15s}}
</style>
</head>
<body>
<header>
  <h1>Walkie</h1>
  <span class="dot" id="dot"></span><span id="conn">Not connected</span>
  <button id="btn" class="primary">Connect bridge</button>
</header>
<main>
  <div id="state">Not connected</div>
  <div id="info" class="dim"></div>
  <button id="ptt" disabled>Hold<br>to talk</button>
  <div class="dim" id="hint">Hold the button (or the space bar) to talk. Release to listen.</div>
  <details id="cfg" open>
    <summary>Key and radio</summary>
    <div class="row">
      <input id="key" type="text" spellcheck="false" autocomplete="off" placeholder="Shared key: 64 hex characters">
      <button id="gen">Generate</button>
    </div>
    <div class="dim" id="keyst" style="margin-top:6px">No key. Use the same key as the hardware units (KEY_HEX in main.py).</div>
    <div class="row">
      <label>Channel <select id="chan"></select></label>
      <label><input type="checkbox" id="lr"> Long range (500 kbps)</label>
    </div>
  </details>
</main>

<script>
'use strict';
// Wire format is identical to the hardware unit (main.py), so browsers and boards can talk to each other:
//   [sid 8][seq 4 BE][AES-256-CTR( pred int16 LE | index u8 | 160 ADPCM bytes )][HMAC-SHA256[:8]]   = 183 bytes
//   iv = sid|seq|00000000 ; keys = SHA256(key|"walkie-enc") and SHA256(key|"walkie-mac")
const $ = id => document.getElementById(id);
const FRAME = 320, RATE = 16000, PKT = 183, HANG_MS = 150, PRIME = 640;   // 20 ms frames, 40 ms jitter margin

// ==CODEC==
const STEP = [7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const nextIdx = (i, c) => clamp(i + ((c & 7) < 4 ? -1 : ((c & 7) - 3) * 2), 0, 88);

function adpcmEnc(pcm, s) {                       // pcm: Int16Array(FRAME); s = {p, i} carried between frames
  const out = new Uint8Array(FRAME / 2);
  let p = s.p, ix = s.i;
  for (let n = 0; n < FRAME; n++) {
    let step = STEP[ix], d = pcm[n] - p, c = 0;
    if (d < 0) { c = 8; d = -d; }
    let df = step >> 3;
    if (d >= step) { c |= 4; d -= step; df += step; }
    step >>= 1;
    if (d >= step) { c |= 2; d -= step; df += step; }
    step >>= 1;
    if (d >= step) { c |= 1; df += step; }
    p = clamp(c & 8 ? p - df : p + df, -32768, 32767);
    ix = nextIdx(ix, c);
    out[n >> 1] |= n & 1 ? c << 4 : c;
  }
  s.p = p; s.i = ix;
  return out;
}

function adpcmDec(data, p, ix) {                  // -> Float32Array(FRAME)
  const out = new Float32Array(FRAME);
  for (let n = 0; n < FRAME; n++) {
    const c = n & 1 ? data[n >> 1] >> 4 : data[n >> 1] & 15, step = STEP[ix];
    let df = step >> 3;
    if (c & 4) df += step;
    if (c & 2) df += step >> 1;
    if (c & 1) df += step >> 2;
    p = clamp(c & 8 ? p - df : p + df, -32768, 32767);
    ix = nextIdx(ix, c);
    out[n] = p / 32768;
  }
  return out;
}

async function deriveKeys(hex) {
  const raw = Uint8Array.from(hex.match(/../g), h => parseInt(h, 16)), tx = new TextEncoder();
  const h = async t => new Uint8Array(await crypto.subtle.digest('SHA-256', new Uint8Array([...raw, ...tx.encode(t)])));
  return {
    ek: await crypto.subtle.importKey('raw', await h('walkie-enc'), 'AES-CTR', false, ['encrypt', 'decrypt']),
    mk: await crypto.subtle.importKey('raw', await h('walkie-mac'), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign'])
  };
}

const tagOf = async (k, d) => new Uint8Array(await crypto.subtle.sign('HMAC', k.mk, d)).subarray(0, 8);
const ivOf = hdr => { const iv = new Uint8Array(16); iv.set(hdr); return iv; };

async function seal(k, sid, seq, pred, idx, adp) {
  const hdr = new Uint8Array(12), body = new Uint8Array(3 + adp.length);
  hdr.set(sid); new DataView(hdr.buffer).setUint32(8, seq);
  body[0] = pred & 255; body[1] = (pred >> 8) & 255; body[2] = idx; body.set(adp, 3);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-CTR', counter: ivOf(hdr), length: 32}, k.ek, body));
  const pk = new Uint8Array(PKT);
  pk.set(hdr); pk.set(ct, 12);
  pk.set(await tagOf(k, pk.subarray(0, PKT - 8)), PKT - 8);
  return pk;
}

async function unseal(k, m) {                     // -> {sid, seq, pred, idx, adp} or null (bad length / key / tamper)
  if (m.length !== PKT) return null;
  const t = await tagOf(k, m.subarray(0, PKT - 8));
  let bad = 0;
  for (let i = 0; i < 8; i++) bad |= t[i] ^ m[PKT - 8 + i];
  if (bad) return null;
  const pt = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-CTR', counter: ivOf(m.subarray(0, 12)), length: 32}, k.ek, m.subarray(12, PKT - 8)));
  if (pt[2] > 88) return null;
  return {sid: m.slice(0, 8), seq: new DataView(m.buffer, m.byteOffset + 8, 4).getUint32(0), pred: (pt[1] << 8 | pt[0]) << 16 >> 16, idx: pt[2], adp: pt.subarray(3)};
}
// ==/CODEC==

// ---------------- state ----------------
let keys = null, connected = false, ptt = false, audioReady = false;
let actx, track;
let sid = crypto.getRandomValues(new Uint8Array(8)), seq = 0, encSt = {p: 0, i: 0};
let acc = new Float32Array(FRAME), accN = 0, txChain = Promise.resolve(), rxChain = Promise.resolve();
const seen = new Map();                           // sender id -> highest seq accepted (replay protection)
let cur = null, lastRx = 0, rssi = null, note = '';
let port = null, reader = null, writer = null, dev = null, inEp = 0, outEp = 0, ctrlN = 0, dataN = 0, wake = null, wchain = Promise.resolve();
const useUSB = !!navigator.usb && (!navigator.serial || /Android/i.test(navigator.userAgent));
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');

// ---------------- UI ----------------
function ui() {
  const on = connected && audioReady && keys;
  $('ptt').disabled = !(on && track);
  $('ptt').className = ptt ? 'tx' : cur ? 'rx' : '';
  $('state').textContent = !connected ? 'Not connected' : !keys ? 'Enter a key' : ptt ? 'Transmitting' : cur ? 'Receiving' : track ? 'Listening' : 'Listening only';
  $('info').textContent = cur && !ptt ? 'from ' + hex(cur.sid.subarray(0, 2)) + (rssi === null ? '' : '   ' + rssi + ' dBm') : note;
  $('dot').className = 'dot' + (connected ? ' on' : '');
  $('conn').textContent = connected ? 'Connected' : 'Not connected';
  $('btn').textContent = connected ? 'Disconnect' : 'Connect bridge';
}
const level = v => $('ptt').style.setProperty('--lvl', Math.min(1, v * 3).toFixed(2));
const rms = a => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / a.length); };

// ---------------- key / radio settings ----------------
async function applyKey() {
  const v = $('key').value.trim().toLowerCase();
  keys = null;
  if (/^[0-9a-f]{64}$/.test(v)) {
    keys = await deriveKeys(v);
    $('keyst').textContent = 'Key ready. All traffic is encrypted and authenticated.';
    try { localStorage.setItem('walkie.key', v); } catch (_) {}
  } else {
    $('keyst').textContent = v ? 'The key must be exactly 64 hex characters (0-9, a-f).' : 'No key. Use the same key as the hardware units (KEY_HEX in main.py).';
  }
  seen.clear(); ui();
}
$('key').oninput = applyKey;
$('gen').onclick = () => { $('key').value = hex(crypto.getRandomValues(new Uint8Array(32))); applyKey(); };
for (let c = 1; c <= 13; c++) $('chan').add(new Option(c, c));
function sendCfg() {
  if (!connected) return;
  usbWrite(new Uint8Array([0xA5, 2, 3, $('lr').checked ? 4 : 1, 0, +$('chan').value])).catch(() => {});
  try { localStorage.setItem('walkie.cfg', JSON.stringify([$('chan').value, $('lr').checked])); } catch (_) {}
}
$('chan').onchange = $('lr').onchange = sendCfg;
try {
  const k = localStorage.getItem('walkie.key'), c = JSON.parse(localStorage.getItem('walkie.cfg') || 'null');
  if (k) $('key').value = k;
  if (c) { $('chan').value = c[0]; $('lr').checked = c[1]; }
} catch (_) {}
applyKey();

// ---------------- audio ----------------
// Playback buffer shared by the AudioWorklet and by the fallback (same source text, so same behavior).
const RING = `class Ring {
  constructor() { this.q = []; this.n = 0; this.o = 0; this.on = false; }
  reset() { this.q = []; this.n = 0; this.o = 0; this.on = false; }
  push(f) {
    this.q.push(f); this.n += f.length;
    while (this.n > 6400) { this.n -= this.q.shift().length - this.o; this.o = 0; }   // cap latency at 400 ms
  }
  pull(o) {
    let i = 0;
    if (!this.on && this.n >= ${PRIME}) this.on = true;
    if (this.on) {
      while (i < o.length && this.q.length) {
        const f = this.q[0], k = Math.min(o.length - i, f.length - this.o);
        o.set(f.subarray(this.o, this.o + k), i); i += k; this.o += k; this.n -= k;
        if (this.o >= f.length) { this.q.shift(); this.o = 0; }
      }
      if (i < o.length) { o.fill(0, i); this.on = false; }   // underrun: re-prime before playing again
    } else o.fill(0);
  }
}`;
const WORKLET = RING + `
class Mic extends AudioWorkletProcessor {
  process(i) { const c = i[0][0]; if (c) this.port.postMessage(c.slice()); return true; }
}
class Spk extends AudioWorkletProcessor {
  constructor() { super(); this.r = new Ring(); this.port.onmessage = e => e.data === 'reset' ? this.r.reset() : this.r.push(e.data); }
  process(_, out) { this.r.pull(out[0][0]); return true; }
}
registerProcessor('mic', Mic); registerProcessor('spk', Spk);`;

let spkPost = () => {};                            // send 'reset' or a Float32Array frame to the speaker

async function loadWorklet() {                     // false = use the ScriptProcessor fallback
  if (!actx.audioWorklet) return false;
  // blob: URLs are refused when the page is opened from disk (file://); a data: URL is accepted there
  for (const url of [() => URL.createObjectURL(new Blob([WORKLET], {type: 'text/javascript'})),
                     () => 'data:text/javascript;base64,' + btoa(WORKLET)]) {
    try { await actx.audioWorklet.addModule(url()); return true; } catch (_) {}
  }
  return false;
}

async function initAudio() {
  if (audioReady) return;
  let stream = null;                               // the microphone is optional: without it the unit only listens
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw {name: 'NotSupportedError'};
    stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  } catch (e) {
    note = e.name === 'NotAllowedError' ? 'Microphone blocked, so this unit only listens. Allow it in the browser to talk.'
      : 'No microphone found, so this unit only listens.';
  }
  const mute = actx.createGain(); mute.gain.value = 0; mute.connect(actx.destination);
  const worklet = await loadWorklet();
  if (worklet) {
    const spk = new AudioWorkletNode(actx, 'spk', {numberOfInputs: 0, outputChannelCount: [1]});
    spk.connect(actx.destination);
    spkPost = m => spk.port.postMessage(m);
  } else {                                         // fallback: ScriptProcessorNode on the main thread
    const ring = new (new Function(RING + '; return Ring;')())();
    const sp = actx.createScriptProcessor(1024, 0, 1);
    sp.onaudioprocess = e => ring.pull(e.outputBuffer.getChannelData(0));
    sp.connect(actx.destination);
    spkPost = m => m === 'reset' ? ring.reset() : ring.push(m);
  }
  audioReady = true;
  if (!stream) return;
  track = stream.getAudioTracks()[0];
  track.enabled = false;
  const src = actx.createMediaStreamSource(stream);
  if (worklet) {
    const mic = new AudioWorkletNode(actx, 'mic');
    src.connect(mic); mic.connect(mute);
    mic.port.onmessage = e => micIn(e.data);
  } else {
    const sp = actx.createScriptProcessor(512, 1, 1);
    sp.onaudioprocess = e => micIn(e.inputBuffer.getChannelData(0).slice());
    src.connect(sp); sp.connect(mute);
  }
}

function micIn(s) {
  if (!ptt) return;
  for (let i = 0; i < s.length; i++) {
    acc[accN++] = s[i];
    if (accN === FRAME) { const f = acc; acc = new Float32Array(FRAME); accN = 0; txFrame(f); }
  }
}


// ---------------- transmit ----------------
function txFrame(f) {
  level(rms(f));
  const pcm = new Int16Array(FRAME);
  for (let i = 0; i < FRAME; i++) pcm[i] = clamp(Math.round(f[i] * 32767), -32768, 32767);
  txChain = txChain.then(async () => {
    if (!connected || !keys) return;
    if (seq >= 0xFFFFFFFF) { sid = crypto.getRandomValues(new Uint8Array(8)); seq = 0; seen.clear(); }
    const p = encSt.p, i = encSt.i, adp = adpcmEnc(pcm, encSt);
    const pk = await seal(keys, sid, seq++, p, i, adp);
    const fr = new Uint8Array(3 + PKT);
    fr[0] = 0xA5; fr[1] = 1; fr[2] = PKT; fr.set(pk, 3);
    await usbWrite(fr);
  }).catch(() => {});
}

function pttDown() {
  if (ptt || !connected || !audioReady || !keys || !track) return;
  actx.resume();
  ptt = true; track.enabled = true; accN = 0; encSt = {p: 0, i: 0}; cur = null;
  spkPost('reset');
  ui();
}
function pttUp() {
  if (!ptt) return;
  ptt = false; track.enabled = false; level(0); ui();
}
const b = $('ptt');
b.onpointerdown = e => { b.setPointerCapture(e.pointerId); pttDown(); };
b.onpointerup = b.onpointercancel = pttUp;
b.oncontextmenu = e => e.preventDefault();
addEventListener('blur', pttUp);
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && !/INPUT|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); pttDown(); } });
addEventListener('keyup', e => { if (e.code === 'Space') pttUp(); });

// ---------------- receive ----------------
function onRadio(m, r) {
  rxChain = rxChain.then(async () => {
    if (ptt || !keys) return;                      // half duplex, like the hardware unit
    const p = await unseal(keys, m);
    if (!p) return;
    const id = hex(p.sid), last = seen.get(id);
    if (last !== undefined && p.seq <= last) return;                 // replayed or late
    if (last === undefined && seen.size >= 8) seen.delete(seen.keys().next().value);
    seen.set(id, p.seq);
    if (cur && hex(cur.sid) !== id) return;                          // one talker at a time
    const gap = cur ? p.seq - cur.seq - 1 : 0;
    if (!cur) { cur = {sid: p.sid}; }
    if (gap > 0 && gap <= 3) for (let i = 0; i < gap; i++) spkPost(new Float32Array(FRAME));   // keep timing over lost frames
    cur.seq = p.seq; lastRx = performance.now(); rssi = r;
    const pcm = adpcmDec(p.adp, p.pred, p.idx);
    level(rms(pcm));
    spkPost(pcm);
    ui();
  }).catch(() => {});
}
setInterval(() => { if (cur && performance.now() - lastRx > HANG_MS) { cur = null; level(0); ui(); } }, 50);

// ---------------- bridge link (same frames as the file-transfer app) ----------------
let buf = new Uint8Array(1 << 16), len = 0;
function usbWrite(bytes) {
  if (!connected || !(useUSB ? dev : writer)) return Promise.reject(new Error('not connected'));
  wchain = wchain.catch(() => {}).then(() => useUSB
    ? dev.transferOut(outEp, bytes).then(r => { if (r.status !== 'ok') throw new Error('usb ' + r.status); })
    : writer.write(bytes));
  return wchain;
}

function ingest(chunk) {                           // bridge -> PC frame: [AA][55][type][n][payload]; type 1 = RX [rssi int8][packet]
  if (len + chunk.length > buf.length) len = 0;
  buf.set(chunk, len); len += chunk.length;
  let p = 0;
  for (;;) {
    while (p + 1 < len && !(buf[p] === 0xAA && buf[p + 1] === 0x55)) p++;
    if (p + 4 > len) break;
    const type = buf[p + 2], n = buf[p + 3];
    if (!((type === 1 && n >= 2 && n <= 251) || (type === 2 && n === 27) || (type === 3 && n === 2))) { p++; continue; }
    if (p + 4 + n > len) break;
    if (type === 1) {
      const r = (buf[p + 4] << 24) >> 24;
      if (n - 1 === PKT) onRadio(buf.slice(p + 5, p + 4 + n), r === -128 ? null : r);
    }
    p += 4 + n;
  }
  if (p > 0) { buf.copyWithin(0, p, len); len -= p; }
}

async function openLink() {
  if (useUSB) {                                    // Android Chrome has no Web Serial: talk CDC over WebUSB
    dev = await navigator.usb.requestDevice({filters: []});
    await dev.open();
    if (!dev.configuration) await dev.selectConfiguration(1);
    let ctrl = null, data = null;
    for (const i of dev.configuration.interfaces) {
      const c = i.alternates[0].interfaceClass;
      if (c === 2) ctrl = i.interfaceNumber;
      if (c === 10) data = i;
    }
    if (ctrl === null || !data) { await dev.close(); dev = null; throw new Error('No serial interface. Use the C3 native USB port.'); }
    await dev.claimInterface(ctrl); await dev.claimInterface(data.interfaceNumber);
    const eps = data.alternates[0].endpoints;
    inEp = eps.find(e => e.direction === 'in').endpointNumber;
    outEp = eps.find(e => e.direction === 'out').endpointNumber;
    ctrlN = ctrl; dataN = data.interfaceNumber;
    await dev.controlTransferOut({requestType: 'class', recipient: 'interface', request: 0x22, value: 1, index: ctrl});
  } else {
    port = await navigator.serial.requestPort();
    await port.open({baudRate: 115200, bufferSize: 1 << 20});
    writer = port.writable.getWriter();
  }
}

async function readLoop() {
  if (useUSB) {
    while (connected && dev) {
      try {
        const r = await dev.transferIn(inEp, 4096);
        if (r.status === 'stall') { await dev.clearHalt('in', inEp); continue; }
        if (r.data && r.data.byteLength) ingest(new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength));
      } catch (_) { break; }
    }
    return;
  }
  while (port && port.readable && connected) {
    reader = port.readable.getReader();
    try { for (;;) { const {value, done} = await reader.read(); if (done) break; if (value) ingest(value); } }
    catch (_) {} finally { try { reader.releaseLock(); } catch (_) {} reader = null; }
    if (!connected) break;
    await new Promise(r => setTimeout(r, 100));
  }
}

async function cleanup() {
  connected = false; pttUp(); cur = null;
  try {
    if (useUSB) { if (dev) { try { await dev.releaseInterface(dataN); await dev.releaseInterface(ctrlN); } catch (_) {} await dev.close(); } }
    else { try { if (reader) await reader.cancel(); } catch (_) {} try { if (writer) writer.releaseLock(); } catch (_) {} if (port) await port.close(); }
  } catch (_) {}
  dev = port = writer = reader = null;
  try { if (wake) { await wake.release(); wake = null; } } catch (_) {}
  ui();
}

$('btn').onclick = async () => {
  if (connected) {
    connected = false;
    try { if (useUSB) { if (dev) await dev.close().catch(() => {}); } else if (reader) await reader.cancel(); } catch (_) {}
    return;
  }
  if (!keys) { $('cfg').open = true; $('key').focus(); ui(); return; }
  actx = actx || new AudioContext({sampleRate: RATE, latencyHint: 'interactive'});
  actx.resume();                                   // inside the click, so the browser allows audio
  try { await openLink(); } catch (e) { note = 'Could not open the bridge: ' + e.message; ui(); dev = port = writer = null; return; }
  note = '';
  try { await initAudio(); } catch (e) { note = 'Audio output unavailable: ' + e.message; connected = true; await cleanup(); return; }
  connected = true; len = 0; wchain = Promise.resolve();
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  ui(); sendCfg();
  await readLoop();
  await cleanup();
};

if (!useUSB && !navigator.serial) { $('btn').disabled = true; note = 'This browser has no Web Serial or WebUSB. Use Chrome or Edge.'; }
ui();
</script>
